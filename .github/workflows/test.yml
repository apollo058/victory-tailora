name: Test

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,fastapi,sqlalchemy]"
      - name: Run unit and integration tests
        run: python -m pytest -q tests/unit tests/integration
      - name: Run Ruff
        run: ruff check .

  minimum-fastapi:
    name: FastAPI minimum supported version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum FastAPI
        run: |
          python -m pip install -e ".[dev,fastapi,sqlalchemy]"
          python -m pip install "fastapi==0.115.0"
      - name: Run tests against minimum FastAPI
        run: python -m pytest -q tests/unit tests/integration

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev,fastapi,sqlalchemy]"
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -q tests/browser
